name: Deploy

# Needs repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID,
# and the repository variable SITE_URL (e.g. https://talaqqa.org). Skips cleanly until they exist.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Cloudflare not configured yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable deploys."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      # Production refuses demo content; previews allow it so the site can be tried before launch.
      - if: env.HAS_TOKEN == 'true'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://talaqqa.pages.dev' }}
          CONTENT_MODE: ${{ github.event_name == 'push' && 'production' || '' }}
      - id: pages
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=talaqqa --branch=${{ github.event_name == 'push' && 'main' || github.head_ref }}
      - name: Post preview link
        if: env.HAS_TOKEN == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.pages.outputs.deployment-url }}
        run: |
          body="Preview: $URL"
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "$body" || gh pr comment ${{ github.event.pull_request.number }} --body "$body"
