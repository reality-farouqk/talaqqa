name: Refresh video metadata

on:
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency: metadata

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/metadata.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit changes and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet content/meta/videos.json; then echo "No metadata changes."; exit 0; fi
          git config user.name "metadata-bot"
          git config user.email "metadata-bot@users.noreply.github.com"
          git add content/meta/videos.json
          git commit -m "content: refresh YouTube metadata"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
      # One open issue lists every unavailable video; it is updated each week and closed when all are fixed.
      - name: Report unavailable videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Unavailable lesson videos"
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -s metadata-report.md ]; then
            if [ -n "$issue" ]; then gh issue edit "$issue" --body-file metadata-report.md
            else gh issue create --title "$title" --body-file metadata-report.md --label broken-video || gh issue create --title "$title" --body-file metadata-report.md; fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "All lesson videos are playable again."
          fi
